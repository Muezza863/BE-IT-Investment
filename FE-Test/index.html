<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Investment Portfolio - Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f111a;
      --bg-secondary: #1a1d2d;
      --surface-glass: rgba(26, 29, 45, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      --status-drafting: #f59e0b;
      --status-waiting: #3b82f6;
      --status-calculated: #10b981;
      --status-error: #ef4444;
      --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.2);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
    }

    /* Sidebar */
    .sidebar {
      width: 280px; background: var(--surface-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid var(--glass-border); padding: 2rem; display: flex; flex-direction: column;
      position: fixed; height: 100vh; z-index: 10;
    }
    .logo-container { display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem; }
    .logo-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-glow); font-weight: 700; }
    .logo-text { font-size: 1.5rem; font-weight: 600; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .nav-item { padding: 1rem 1.25rem; border-radius: 12px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 1rem; color: var(--text-muted); }
    .nav-item:hover { background: rgba(255, 255, 255, 0.03); color: var(--text-main); transform: translateX(5px); }
    .nav-item.active { background: var(--accent-gradient); color: white; box-shadow: var(--shadow-glow); }

    /* Main */
    .main-content { margin-left: 280px; flex: 1; padding: 2rem 3rem; display: flex; flex-direction: column; gap: 2rem; }
    .top-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--glass-border); }
    .profile-img { width: 45px; height: 45px; border-radius: 50%; background: var(--bg-secondary); border: 2px solid var(--accent-primary); display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* Stats & Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; }
    .stat-card { background: var(--surface-glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1.5rem; transition: var(--transition); }
    .stat-title { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
    .stat-value { font-size: 2rem; font-weight: 700; display: block; margin-top: 0.5rem; }

    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .project-card { background: var(--surface-glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; transition: var(--transition); display: flex; flex-direction: column; gap: 1rem; }
    .project-card:hover { transform: translateY(-5px); border-color: var(--accent-primary); box-shadow: var(--shadow-glow); }
    
    .status-badge { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
    .status-drafting { background: rgba(245, 158, 11, 0.1); color: var(--status-drafting); }
    .status-waiting { background: rgba(59, 130, 246, 0.1); color: var(--status-waiting); }
    .status-calculated { background: rgba(16, 185, 129, 0.1); color: var(--status-calculated); }

    .btn-primary { background: var(--accent-gradient); color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 10px; font-weight: 600; cursor: pointer; transition: var(--transition); }
    .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--bg-secondary); padding: 2rem; border-radius: 20px; width: 100%; max-width: 500px; border: 1px solid var(--glass-border); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
    .form-control { width: 100%; background: var(--bg-primary); border: 1px solid var(--glass-border); color: white; padding: 0.8rem; border-radius: 8px; }

    @media (max-width: 768px) {
      .sidebar { width: 70px; padding: 1rem; }
      .logo-text, .nav-item span { display: none; }
      .main-content { margin-left: 70px; padding: 1rem; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo-container"><div class="logo-icon">IT</div><div class="logo-text">Investasi</div></div>
    <ul class="nav-links">
      <li class="nav-item"><i>📊</i><span>Dashboard</span></li>
      <li class="nav-item active"><i>📁</i><span>Projects</span></li>
    </ul>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div class="header-title"><h1>Projects Portfolio</h1><p>Manage your IT investments</p></div>
      <div class="header-profile"><div class="profile-img">KW</div></div>
    </header>

    <section class="stats-grid" id="statsContainer">
      <div class="stat-card"><span class="stat-title">Total</span><span class="stat-value" id="totalCount">0</span></div>
      <div class="stat-card"><span class="stat-title">Calculated</span><span class="stat-value" id="calcCount">0</span></div>
    </section>

    <section>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Recent Projects</h2>
        <button class="btn-primary" onclick="toggleModal(true)">+ New Project</button>
      </div>
      <div class="project-grid" id="projectGrid">
        <p style="color: var(--text-muted)">Loading projects...</p>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <h2 style="margin-bottom: 1.5rem;">Create New Project</h2>
      <form id="createProjectForm">
        <div class="form-group">
          <label>Industry</label>
          <select id="inputIndustry" class="form-control" required>
            <option value="Finance">Finance</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Retail">Retail</option>
            <option value="Healthcare">Healthcare</option>
          </select>
        </div>
        <div class="form-group">
          <label>Strategic Plan Focus</label>
          <input type="text" id="inputPlan" class="form-control" placeholder="Digital Transformation 2026" required>
        </div>
        <div class="form-group">
          <label>Employee Count</label>
          <input type="number" id="inputEmployeeCount" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="inputLocation" class="form-control" required>
        </div>
        <p id="formError" style="color: var(--status-error); font-size: 0.8rem; margin-bottom: 1rem;"></p>
        <div style="display: flex; gap: 1rem;">
          <button type="button" class="btn-primary" style="background: var(--bg-primary);" onclick="toggleModal(false)">Cancel</button>
          <button type="submit" id="submitBtn" class="btn-primary" style="flex: 1;">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://unvicarious-camelia-porky.ngrok-free.dev';
    const projectGrid = document.getElementById('projectGrid');
    
    // Helper to close modal when clicking outside
    document.getElementById('addModal').addEventListener('click', (e) => {
      if(e.target.id === 'addModal') toggleModal(false);
    });

    function toggleModal(show) {
      document.getElementById('addModal').classList.toggle('active', show);
      if(!show) document.getElementById('createProjectForm').reset();
    }

    // Unified API Fetcher to handle CORS & Ngrok
    async function apiFetch(endpoint, options = {}) {
      const token = localStorage.getItem('token');
      const headers = {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true', // CRITICAL for Ngrok
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        ...options.headers
      };

      try {
        const response = await fetch(`${BASE_URL}${endpoint}`, { ...options, headers });
        
        if (response.status === 401) {
          localStorage.removeItem('token');
          window.location.href = 'login.html';
          return;
        }
        return response;
      } catch (err) {
        console.error("Network Error:", err);
        throw err;
      }
    }

    async function fetchProjects() {
      try {
        const response = await apiFetch('/api/projects');
        if (!response.ok) throw new Error('Gagal mengambil data');
        
        const resData = await response.json();
        const projects = resData.data || [];

        projectGrid.innerHTML = '';
        
        // Update Stats
        document.getElementById('totalCount').innerText = projects.length;
        document.getElementById('calcCount').innerText = projects.filter(p => p.status === 'CALCULATED').length;

        if (projects.length === 0) {
          projectGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No projects found.</p>';
          return;
        }

        projects.forEach(p => {
          const pid = p._id || p.id;
          const statusClass = `status-${(p.status || 'drafting').toLowerCase().replace('_user_input', '')}`;
          
          projectGrid.innerHTML += `
            <div class="project-card">
              <div style="display: flex; justify-content: space-between; align-items: start;">
                <div>
                  <h3 style="color: var(--accent-primary); font-size: 0.9rem;">#${String(pid).slice(-6).toUpperCase()}</h3>
                  <p style="font-weight: 600; margin-top: 0.2rem;">${p.industry}</p>
                </div>
                <span class="status-badge ${statusClass}">${(p.status || 'DRAFTING').replace(/_/g, ' ')}</span>
              </div>
              <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;">Plan: ${p.plan || 'No plan description'}</p>
              <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.75rem; color: var(--text-muted);">${p.date || 'No Date'}</span>
                <button class="btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;" onclick="location.href='project-detail.html?id=${pid}'">View Detail</button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        projectGrid.innerHTML = `<p style="color: var(--status-error)">Error: Check if backend is active at ${BASE_URL}</p>`;
      }
    }

    document.getElementById('createProjectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('formError');
      
      btn.disabled = true;
      btn.innerText = 'Processing...';
      errEl.innerText = '';

      const payload = {
        industry: document.getElementById('inputIndustry').value,
        employeeCount: Number(document.getElementById('inputEmployeeCount').value),
        plan: document.getElementById('inputPlan').value,
        location: document.getElementById('inputLocation').value,
        // Mock data agar lolos validasi backend Mongoose/Joi kamu
        businessDomain: { SM: 3, CA: 3, MI: 3, CR: 3, OR: 3 },
        technologyDomain: { SA: 3, DU: 3, TU: 3, IR: 3 },
        currentIT: [1, 1, 1, 1], futureIT: [3, 3, 3, 3], DM: [3, 3, 3, 3], RE: [3, 3, 3, 3]
      };

      try {
        const response = await apiFetch('/api/projects', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          toggleModal(false);
          fetchProjects();
        } else {
          const res = await response.json();
          errEl.innerText = res.message || 'Error saving project';
        }
      } catch (err) {
        errEl.innerText = 'Connection refused. Is Backend running?';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Create Project';
      }
    });

    // Initialize
    if (!localStorage.getItem('token')) {
      window.location.href = 'login.html';
    } else {
      fetchProjects();
    }
  </script>
</body>
</html>
