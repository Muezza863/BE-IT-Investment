<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tab-login">Login</button>
        <button class="tab" id="tab-register">Register</button>
      </div>

      <form id="form-login">
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="email@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Password" required />
        </div>
        <p class="error" id="login-error"></p>
        <button type="submit" class="btn-submit">Login</button>
      </form>

      <form id="form-register" style="display:none">
        <div class="field">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="email@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Minimal 6 karakter" required />
        </div>
        <p class="error" id="reg-error"></p>
        <p class="success" id="reg-success"></p>
        <button type="submit" class="btn-submit">Register</button>
      </form>
    </div>
  </div>

  <!-- Import JS sebagai module -->
  <script type="module" src="app.js"></script>
</body>
</html>
